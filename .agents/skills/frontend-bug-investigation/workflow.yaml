meta:
  name: "Frontend Bug Investigation Workflow"
  version: "1.0"
  description: "Investigate suspected frontend bugs, validate them with runtime evidence when possible, recommend coverage, and return the repository to its baseline."

source_skills:
  - name: frontend-bug-investigation

state:
  fields:
    - name: task
      type: string
      required: true
      description: "User-facing frontend bug investigation request."
    - name: target_repo
      type: string
      description: "Repository or app under investigation."
    - name: target_scope
      type: string
      description: "Routes, modules, files, or user flows in scope."
    - name: baseline_snapshot
      type: string
      description: "Initial git status, tracked diff summary, and untracked artifact baseline."
    - name: investigation_plan
      type: string
    - name: bug_candidates
      type: string
    - name: evidence_summary
      type: string
    - name: repro_summary
      type: string
    - name: root_cause_summary
      type: string
    - name: coverage_recommendation
      type: string
    - name: cleanup_status
      type: string
      default: "pending"
      description: "returned_to_baseline | cleanup_needed | blocked"
    - name: workflow_status
      type: string
      default: "pending"
      description: "done | fixable_auto | fixable_needs_decision | blocked | budget_exhausted"
    - name: next_target
      type: string
      default: "final_report"
      description: "investigate_and_verify | final_report"
    - name: blocker_type
      type: string
      default: "none"
      description: "none | no_repro_path | env_data | auth_runtime | mutation_policy | cleanup_failed | product_expectation_mismatch | unknown"
    - name: needs_user_decision
      type: boolean
      default: false
    - name: revisionCount
      type: number
      default: 0
    - name: review_result_text
      type: string
    - name: loop_gate_value
      type: string
      default: "loop_gate"
    - name: final_report_text
      type: string

nodes:
  - id: scope_and_baseline
    type: agent
    dispatch: subissue
    agent: "frontend-investigator"
    inputs: [task]
    outputs: [target_repo, target_scope, baseline_snapshot, investigation_plan]
    config:
      system: |
        Use the frontend-bug-investigation skill.
        Scope the request before changing anything. Identify the target repository, routes/modules/user flows, likely frontend bug surfaces, and the smallest validation strategy.

        Mandatory baseline gate:
        - Run git status --short, git diff --stat, and git ls-files --others --exclude-standard in the target repo when it is a git worktree.
        - Record pre-existing tracked and untracked state as baseline_snapshot.
        - Do not clean or revert user pre-existing changes.
        - If the target is /Users/bytedance/nova/nova-platform, call out the Nova profile: EdenX + React 17, Garfish/Pearl host, env/oec_region/app_group query context, and nova-e2e validation options.

        Return target_repo, target_scope, baseline_snapshot, and investigation_plan. Do not perform deep code changes in this node.

  - id: investigate_and_verify
    type: agent
    dispatch: subissue
    agent: "frontend-investigator"
    inputs: [task, target_repo, target_scope, baseline_snapshot, investigation_plan, review_result_text, revisionCount]
    outputs: [bug_candidates, evidence_summary, repro_summary, root_cause_summary, coverage_recommendation, cleanup_status]
    config:
      system: |
        Use the frontend-bug-investigation skill.
        Investigate the scoped frontend bug surfaces and validate candidates with the smallest reliable evidence.

        Required work:
        - Inspect relevant frontend code before forming conclusions.
        - Create bug candidates only when there is a concrete validation path.
        - Prefer runtime evidence for candidates that can be reached in a browser: console errors, pageerror, requestfailed, 4xx/5xx, final URL, visible UI state, screenshot, trace, or focused Playwright artifact.
        - For Nova nova-platform, prefer existing apps/nova-e2e Playwright infrastructure when a flow maps to existing e2e patterns; short local Playwright probes are allowed for triage.
        - Temporary instrumentation, scripts, or probes are allowed during this node, but must be removed before the node completes.
        - Do not inspect cookies, localStorage, or saved profile secrets unless the user explicitly authorized that scope.

        Completion requirements:
        - Output bug_candidates with confidence labels: confirmed bug, high-risk suspicion, needs business confirmation, or blocked by env/data.
        - Output evidence_summary, repro_summary, root_cause_summary, and coverage_recommendation.
        - Run the cleanup gate against baseline_snapshot before completing.
        - Set cleanup_status to returned_to_baseline only if agent-created tracked changes and untracked debug artifacts have been removed.
        - If cleanup cannot return to baseline, set cleanup_status to cleanup_needed or blocked and list the remaining delta.

  - id: review_cleanup
    type: agent
    dispatch: subissue
    agent: "frontend-investigation-reviewer"
    inputs: [task, target_repo, target_scope, baseline_snapshot, bug_candidates, evidence_summary, repro_summary, root_cause_summary, coverage_recommendation, cleanup_status, revisionCount]
    outputs: [workflow_status, next_target, blocker_type, needs_user_decision, review_result_text]
    on_complete:
      - action: increment
        field: revisionCount
    config:
      system: |
        Review the frontend investigation result as a strict evidence and cleanup gate.

        Decide:
        - workflow_status=done when findings are evidence-backed or honestly classified, repro/root cause/coverage are useful, and cleanup_status=returned_to_baseline.
        - workflow_status=fixable_auto and next_target=investigate_and_verify when one more bounded pass can gather missing evidence or fix cleanup without user input.
        - workflow_status=fixable_needs_decision when the next step requires product expectation, auth, data, mutation, or environment approval.
        - workflow_status=blocked when validation or cleanup is blocked and automatic work cannot safely continue.
        - workflow_status=budget_exhausted when revisionCount is 2 or more and more automatic investigation would be needed.

        Hard cleanup rule:
        - If cleanup_status is not returned_to_baseline, do not mark done.
        - Do not ask the next node to keep debug code. The only acceptable automatic target is cleanup or more evidence gathering with no retained code changes.

        Return a concise review_result_text explaining evidence quality, remaining gaps, cleanup state, and the routing decision.

  - id: loop_gate
    type: transform
    dispatch: inline
    inputs: [workflow_status, next_target, revisionCount]
    outputs: [loop_gate_value]
    config:
      transform:
        loop_gate_value: "loop_gate"

  - id: final_report
    type: final_response
    dispatch: main_issue_task
    inputs: [task, target_repo, target_scope, baseline_snapshot, bug_candidates, evidence_summary, repro_summary, root_cause_summary, coverage_recommendation, cleanup_status, workflow_status, blocker_type, needs_user_decision, revisionCount, review_result_text]
    outputs: [final_report_text]
    config:
      system: |
        Produce the final investigation report for the root issue.

        Include:
        - confirmed bugs first, then high-risk suspicions, then business-confirmation or blocked cases
        - evidence, minimal repro path, likely root cause, and recommended automated coverage for each meaningful case
        - exact validation that was run or why validation was blocked
        - cleanup status, explicitly stating whether tracked state returned to baseline and whether agent-created untracked debug artifacts were removed

        If needs_user_decision is true, ask for the precise decision needed to continue. Do not claim the investigation is complete when cleanup failed or required validation is blocked.

routing:
  - from: START
    to: scope_and_baseline
  - from: scope_and_baseline
    to: investigate_and_verify
  - from: investigate_and_verify
    to: review_cleanup
  - from: review_cleanup
    to: loop_gate
  - from: loop_gate
    condition: 'workflow_status == "fixable_auto" && next_target == "investigate_and_verify" && revisionCount < 2'
    to: investigate_and_verify
    else: final_report
  - from: final_report
    to: END

execution:
  maxSteps: 8
  defaultProfile: standard
  profiles:
    standard:
      hardTimeoutMs: 300000
      firstProgressTimeoutMs: 0
      idleTimeoutAfterProgressMs: 90000
      softTimeoutMs: 45000
      maxOutputChars: 32000
